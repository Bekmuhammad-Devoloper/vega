name: Deploy

# `saas` branchiga push -> tekshiruv -> serverga deploy.
# Qo'lda ishga tushirish uchun: Actions -> Deploy -> Run workflow
on:
  push:
    branches: [saas]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: "Frontendlarni qayta qurmaslik (tezroq)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false      # deploy yarmida uzilmasin

jobs:
  # ── 1) Darvoza: buzuq kod serverga chiqmasin ──────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Bog'liqliklar
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Tip tekshiruvi
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: backend
        run: npx nest build

  # ── 2) Deploy: faqat tekshiruv o'tsa ─────────────────────────
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH kalitini o'rnatish
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Ulanish tashxisi. Oldingi yiqilishda `ssh-keyscan` serverga yetib
      # borgan (server jurnalida ko'rindi), lekin `ssh` ning o'zi ULANISHGA
      # HAM urinmagan -> xato runner tomonida, maxfiy kalit faylida bo'lishi
      # kerak. Bu qadam sababni aniq aytadi. FAQAT OCHIQ kalit chop etiladi.
      - name: SSH tashxisi
        continue-on-error: true
        run: |
          echo "--- kalit fayli ---"
          echo "bayt: $(wc -c < ~/.ssh/id_deploy)"
          head -1 ~/.ssh/id_deploy | grep -q BEGIN && echo 'sarlavha: BOR' || echo 'sarlavha: YOQ - kalit buzuq'
          file ~/.ssh/id_deploy | sed 's/.*: /turi: /'
          echo "--- shu maxfiy kalitdan olingan OCHIQ kalit (maxfiy emas) ---"
          ssh-keygen -y -P '' -f ~/.ssh/id_deploy || echo 'KALIT OQILMADI - SSH_KEY secretini qayta joylang'
          echo "--- serverda kutilayotgani ---"
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ17kIWSwV69ZWSzSahvR6Uwq0Fn1nwO8xqUOdrjfAmO"
          echo "--- ulanish sinovi ---"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'echo ULANDI; hostname' || echo ULANMADI

      - name: Serverda deploy
        env:
          # push -> frontendlar HAM quriladi. Ilgari bu yerda faqat
          # `inputs.skip_frontend` qaralardi; push'da inputs bo'sh bo'lgani
          # uchun frontend deyarli hech qachon qurilmasdi va panelga eski
          # build chiqib turardi ("push qildim, lekin ko'rinmayapti").
          # Qo'lda ishga tushirilganda esa tanlov o'zgarishsiz ishlaydi.
          SKIP_FE: ${{ github.event_name == 'workflow_dispatch' && (inputs.skip_frontend && '1' || '0') || '0' }}
        run: |
          # deploy.sh serverda ALOHIDA nusxa (/opt/vega/deploy.sh) bo'lib turadi.
          # Uni avval repodagi versiya bilan yangilaymiz — aks holda skriptga
          # kiritilgan tuzatish push qilinsa ham serverga hech qachon yetmaydi.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/vega/app && git fetch --depth=1 origin saas && git reset --hard origin/saas && cp deploy/deploy.sh /opt/vega/deploy.sh && chmod +x /opt/vega/deploy.sh"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "SKIP_FRONTEND=$SKIP_FE bash /opt/vega/deploy.sh saas"

      - name: Serverda ayni shu commit ishlayaptimi
        run: |
          REMOTE=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${{ secrets.SSH_PORT || 22 }}"             "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"             'git -C /opt/vega/app rev-parse HEAD')
          echo "kutilgan: ${{ github.sha }}"
          echo "serverda: $REMOTE"
          if [ "$REMOTE" != "${{ github.sha }}" ]; then
            echo "::error::Deploy o'tdi deb ko'rsatdi, lekin serverda BOSHQA commit turibdi"
            exit 1
          fi

      # Sog'liq SERVERNING O'ZIDA tekshiriladi, ommaviy domen orqali emas.
      #
      # Nega: domen orqali tekshirish DNS'ga bog'lanib qoladi. Server
      # ko'chirilganda deploy muvaffaqiyatli bo'lsa ham bu qadam qizil
      # bo'lardi; aksincha, eski server hali javob berayotgan bo'lsa yangi
      # deploy singan holda ham yashil ko'rinardi. 127.0.0.1:2400 aynan
      # hozir deploy qilingan nusxani tekshiradi.
      - name: Sog'liq tekshiruvi
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${{ secrets.SSH_PORT || 22 }}"             "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'REMOTE'
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10               http://127.0.0.1:2400/api/catalog/services || echo 000)
            echo "urinish $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "SOGLIQ TEKSHIRUVI OTMADI - pm2 loglarini koring"
          exit 1
          REMOTE
