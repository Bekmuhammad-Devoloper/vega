  <!-- secondary accent sparkle -->
  <path
    d="M398 120 C401.4 138.6 411.4 148.6 430 152 C411.4 155.4 401.4 165.4 398 184 C394.6 165.4 384.6 155.4 366 152 C384.6 148.6 394.6 138.6 398 120 Z"
