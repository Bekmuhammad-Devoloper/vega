# ── IP orqali kirish (sinov uchun) -> API ─────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2400; include snippets/vega-proxy.conf; }
}

# ── DEV PANEL (faqat platforma egasi) ────────────────────────────
server {
    listen 80;
    server_name vega.yuksalish.dev;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2404; include snippets/vega-proxy.conf; }
}

