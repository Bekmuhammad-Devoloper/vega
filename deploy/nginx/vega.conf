# ── IP orqali kirish (sinov uchun) -> API ─────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 12m;
    # IP orqali kirilganda landing ko'rinadi; /api/ esa backendga ketadi
    # (CI sog'liq tekshiruvi shu yo'ldan foydalanadi).
    location /api/ { proxy_pass http://127.0.0.1:2400; include snippets/vega-proxy.conf; }
    location /     { proxy_pass http://127.0.0.1:2401; include snippets/vega-proxy.conf; }
}

# ── DEV PANEL (faqat platforma egasi) ────────────────────────────
server {
    server_name vega.yuksalish.dev;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2404; include snippets/vega-proxy.conf; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vega.yuksalish.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vega.yuksalish.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ── MAHSULOT: landing ────────────────────────────────────────────
server {
    listen 80;
    server_name uz-simcard.uz www.uz-simcard.uz;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2401; include snippets/vega-proxy.conf; }
}

# ── MAHSULOT: backend API ────────────────────────────────────────
server {
    listen 80;
    server_name api.uz-simcard.uz;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2400; include snippets/vega-proxy.conf; }
}

# ── MAHSULOT: mijoz Mini App (bot) ───────────────────────────────
server {
    listen 80;
    server_name app.uz-simcard.uz;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2402; include snippets/vega-proxy.conf; }
}

# ── MAHSULOT: reseller paneli ────────────────────────────────────
server {
    listen 80;
    server_name admin.uz-simcard.uz;
    client_max_body_size 12m;
    location / { proxy_pass http://127.0.0.1:2403; include snippets/vega-proxy.conf; }
}

server {
    if ($host = vega.yuksalish.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name vega.yuksalish.dev;
    return 404; # managed by Certbot


}
